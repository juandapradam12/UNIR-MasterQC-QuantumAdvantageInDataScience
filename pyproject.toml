[project]
name = "qadvantage"
version = "0.1.0"
description = "TFM Master en Computacion Cuantica (UNIR): ventaja cuantica en ciencia de datos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "qiskit>=1.2",
    "qiskit-aer>=0.14",
    "qiskit-machine-learning>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "jupyter>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qadvantage"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
